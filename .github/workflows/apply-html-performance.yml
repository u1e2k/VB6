name: Apply reviewed HTML performance changes
on:
  push:
    branches: [perf/html-rendering-retention]
    paths: [tools/apply-html-performance.py, .github/workflows/apply-html-performance.yml]
permissions:
  contents: write
concurrency:
  group: apply-html-performance
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hash-guarded source edits, preserving unrelated main changes
        run: |
          python tools/apply-html-performance.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ide/virtual-list.js')
          p.write_text(p.read_text().replace("if(!this.root.hasAttribute('aria-label'))", "if(!this.root.getAttribute('aria-label'))"))
          PY
          npm run build
          npm test
      - name: Commit reviewed sources and reproducible distributions
        run: |
          git rm tools/apply-html-performance.py
          git add src/controls/controls.js src/designer/designer.js src/ide/virtual-list.js dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(html): retain visible rows and batch designer layout reads'
          git push origin HEAD:refs/heads/perf/html-rendering-retention
