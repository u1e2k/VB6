name: Apply reviewed renderer continuation
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [tools/rendering-continuation.patch.xz, .github/workflows/apply-rendering-continuation.yml]
permissions:
  contents: write
concurrency:
  group: renderer-continuation-publication
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed source patch and apply without changing unrelated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          packed = Path('tools/rendering-continuation.patch.xz').read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'e3bbc6a7602bbfae4885300f0993396fc93f9048fc4f0b470343a9a5e6c4cf66'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '68570b5bc77dddad787a9d7d0a898312e0ca5226b1f0fd0e44ab6cee7cea18ed'
          Path('/tmp/rendering-continuation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/rendering-continuation.patch
          git apply /tmp/rendering-continuation.patch
          npm run build
          npm test
      - name: Commit normal sources and reproducible distributions
        run: |
          git rm tools/rendering-continuation.patch.xz
          git add src/rendering tests/rendering-retention.test.mjs tests/fixtures/rendering.html tools/browser-rendering-tests.py docs/RENDERING-SOURCES.md dist src/exporter/runtime-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): verify actual GPU output and retain immutable geometry and batches'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
