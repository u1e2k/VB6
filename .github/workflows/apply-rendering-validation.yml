name: Apply rendering validation corrections
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-validation.patch, .github/workflows/apply-rendering-validation.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed test isolation and stricter pixel gate
        run: |
          echo '66b7971859d72b90fd537b61d973bd6659515824182e1b763c8894a3c7abdd6a  .rendering-validation.patch' | sha256sum --check
          git apply --check .rendering-validation.patch
          git apply .rendering-validation.patch
          python -m py_compile tools/browser-rendering-tests.py
          git rm .rendering-validation.patch
          git add tools/browser-rendering-tests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(rendering): isolate GPU workload, require exact IDE pixels and avoid forced compositor backend'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
