name: Reconcile classic rendering with current main
on:
  push:
    branches: [fix/classic-bevels-and-list-reuse]
    paths: [.github/workflows/classic-final-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned reviewed main; regenerate only derived conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff a344a8fa8d667adbd934e595dd618836930b2120 || true
          python - <<'PY'
          import subprocess
          from pathlib import Path
          assert Path('.git/MERGE_HEAD').exists(), 'Pinned main must be merged'
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          for path in paths:
              assert path.startswith(('dist/','examples/')) or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js'], 'Unexpected authored conflict: '+path
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          PY
          npm run build
          npm test
          python tools/test-package-notices.py
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git commit -m 'merge(html): preserve latest IntelliSense and regenerate attributed distributions'
          git push origin HEAD:refs/heads/fix/classic-bevels-and-list-reuse
          git bundle create /tmp/classic-ready.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: classic-ready-source
          path: /tmp/classic-ready.bundle
          retention-days: 7
