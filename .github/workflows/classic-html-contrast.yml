name: Publish classic high-contrast correction
on:
  push:
    branches: [fix/classic-bevels-and-list-reuse]
    paths: [.github/workflows/classic-html-contrast.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed high-contrast rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/theme/bevels.css')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3f2b152aa8114b4a3a1ef72ab2785c300605271648a59d02b5d3ca8b3468bbd6'
          p.write_text(p.read_text()+'''
          /* Explicit high-contrast suppression also covers engines which expose the
             forced-colors media query without suppressing computed author shadows.
             Keep the original real borders, native colors and keyboard focus outlines. */
          @media (forced-colors: active) {
           .classic-bevel-raised,.classic-bevel-sunken,.vb-command,
           .vb-form:not(.vb-borderless),.vb-dialog,.ide-dialog,.classic-menu,
           .vb-popup-menu.classic-menu,.ide-dialog-footer button,.vb-dialog-actions button,
           .window-buttons button,.caption-close,.tool-caption button,.vb-window-button,
           .vb-combo-arrow,.vb-spin-button,.vb-scroll-arrow,.vb-scroll-thumb,
           .vb-control input,.vb-control textarea,.vb-control select,.vb-dialog input {
             box-shadow:none!important;text-shadow:none!important;
           }
          }
          ''')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='af498665acc2b535a48a4e514b032cc8e20d83b91a0ebb239d8339dc3a628b59'
          PY
          npm run build
          npm test
          git add src/theme/bevels.css dist src/exporter/runtime-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(html): retain real borders and suppress shadows in forced-color mode'
          git push origin HEAD:refs/heads/fix/classic-bevels-and-list-reuse
