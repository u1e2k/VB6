name: Materialize classic HTML sources
on:
  push:
    branches: [fix/classic-bevels-and-list-reuse]
    paths: [.classic-html-source.b64, .github/workflows/classic-html-materialize.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify full source patch before applying
        run: |
          python - <<'PY'
          import base64,hashlib,lzma
          from pathlib import Path
          text=Path('.classic-html-source.b64').read_text()
          # Correct one known duplicated transport token, then verify every
          # decoded source byte against the locally reviewed patch checksum.
          text=text.replace('H5+qoj6K6KQjD0F','H5+qoj6KQjD0F')
          patch=lzma.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='33853f9307dd7c27a4e8725b42de4b9a491714571aa40380eef134d8c943d90c'
          Path('/tmp/classic-html.patch').write_bytes(patch)
          PY
          git apply --check /tmp/classic-html.patch
          git apply /tmp/classic-html.patch
          npm run build
          npm test
      - name: Publish ordinary source and reproducible distributions
        run: |
          git rm .classic-html-source.b64
          git add .gitignore package.json src/theme/bevels.css src/ide/virtual-list.js src/exporter/runtime-payload.js tools/build.mjs tools/browser-classic-html.py tests/classic-bevels.test.mjs tests/tool-list-scheduling.test.mjs tests/fixtures/tool-list-legacy.mjs docs/CLASSIC-HTML-RENDERING.md LICENSES/98.css.txt dist examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(html): attribute classic staircase bevels and retain unchanged tool-list rows'
          git push origin HEAD:refs/heads/fix/classic-bevels-and-list-reuse
          git bundle create /tmp/classic-html-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-html-reviewed-source
          path: /tmp/classic-html-source.bundle
          retention-days: 3
