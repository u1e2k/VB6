name: Rebuild classic HTML correction
on:
  push:
    branches: [fix/classic-bevels-and-list-reuse]
    paths: [.classic-html-fix.patch, .github/workflows/classic-html-rebuild.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed geometry correction and regenerate applications
        run: |
          echo '0bf157b328a758853ad9600cfddce79cb9aa97a5ff0c2156a373bd54065b82ef  .classic-html-fix.patch' | sha256sum --check
          git apply --check .classic-html-fix.patch
          git apply .classic-html-fix.patch
          npm run build
          npm test
          git rm .classic-html-fix.patch
          git add src/theme/bevels.css tools/browser-classic-html.py docs/CLASSIC-HTML-RENDERING.md dist src/exporter/runtime-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(html): preserve original container border metrics at fractional DPI'
          git push origin HEAD:refs/heads/fix/classic-bevels-and-list-reuse
          git bundle create /tmp/classic-html-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: classic-html-fractional-source
          path: /tmp/classic-html-source.bundle
          retention-days: 3
