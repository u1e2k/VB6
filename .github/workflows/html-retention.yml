name: HTML rendering retention
on:
  pull_request:
    paths: ['src/controls/**', 'src/designer/**', 'src/ide/virtual-list.js', 'tools/browser-html-retention.py', 'tests/fixtures/html-retention.js', '.github/workflows/html-retention.yml']
  push:
    branches: [main]
    paths: ['src/controls/**', 'src/designer/**', 'src/ide/virtual-list.js', 'tools/browser-html-retention.py', 'tests/fixtures/html-retention.js', '.github/workflows/html-retention.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: html-retention-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      HTML_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '48442f0b925dc3c136b1a0b74184f31f4d6263c2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve unchanged baseline and build proposed sources
        run: |
          git show "$HTML_BASELINE_SHA:dist/VB6-Studio-Web.html" > /tmp/html-baseline.html
          npm run build
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: DOM identity, layout reads, exact DPI screenshots and paired CPU observations
        run: python tools/browser-html-retention.py --browser ${{ matrix.browser }} --baseline /tmp/html-baseline.html
      - name: Verify generated bundle reproducibility
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-retention-${{ matrix.browser }}
          path: reports/html-retention
          retention-days: 14
