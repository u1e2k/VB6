name: Native macOS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile and execute native conformance
        run: node tools/test-macos-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-${{ matrix.os }}
          path: |
            reports/macos-native
            artifacts/macos-native
          retention-days: 7
