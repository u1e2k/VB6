name: Integrate rendering acceptance candidate
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-acceptance.patch, .github/workflows/rendering-acceptance-sync.yml]
permissions:
  contents: read
concurrency:
  group: rendering-acceptance-source
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Capture exact branch and scalar-runtime main for authored merge review
        run: git bundle create /tmp/rendering-acceptance-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-acceptance-source
          path: /tmp/rendering-acceptance-source.bundle
          retention-days: 7
