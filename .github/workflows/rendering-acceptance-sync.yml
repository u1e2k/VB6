name: Integrate rendering acceptance candidate
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-acceptance.patch, .github/workflows/rendering-acceptance-sync.yml]
permissions:
  contents: write
concurrency:
  group: rendering-acceptance-source
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve reviewed scalar and native interoperability changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git bundle create /tmp/rendering-acceptance-source.bundle HEAD refs/remotes/origin/main
          git merge --no-commit --no-ff 72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3 || true
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          main_ref='72dae4fa89e165f6f0dc0ba0aad5cb7615508ea3'
          def source(ref,path): return subprocess.check_output(['git','show',ref+':'+path]).decode()
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          for path in conflicts:
              if path.startswith(('dist/','examples/')) or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']:
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
              elif path=='src/runtime/entry.js':
                  main=source(main_ref,path)
                  imports="import {UIRenderer, retainRenderer, rendererForDocument} from '../rendering/renderer.js';\nimport {normalizeRendering, DEFAULT_RENDERING} from '../rendering/policy.js';\n"
                  assert main.count('export const RuntimeAPI={')==1
                  Path(path).write_text(imports+main.replace('export const RuntimeAPI={','export const RuntimeAPI={UIRenderer,retainRenderer,rendererForDocument,normalizeRendering,DEFAULT_RENDERING,'))
              elif path=='README.md':
                  # Reviewed conflict: independent sections inserted at the same location.
                  ours=source('HEAD',path);main=source(main_ref,path)
                  section=ours.split('### UI rendering backends\n',1)[1].split('### Advanced browser Win32 GDI',1)[0]
                  assert main.count('### Advanced browser Win32 GDI')==1
                  assert '## Scalar and Variant source compatibility' in main
                  Path(path).write_text(main.replace('### Advanced browser Win32 GDI','### UI rendering backends\n'+section+'### Advanced browser Win32 GDI'))
              elif path=='src/editor/editor.js':
                  # Main's resumed-IME task supersedes the old timer handler.
                  # Retain its module/project/read-only guards AND our cancellation
                  # on read-only/Escape, without defining cancel twice.
                  main=source(main_ref,path)
                  pairs=[('setReadOnly(value){if(value){this.closeCompletion();','setReadOnly(value){if(value){this.cancelCompositionAssistance();this.closeCompletion();'),("if(e.key==='Escape'){this.closeCompletion();","if(e.key==='Escape'){this.cancelCompositionAssistance();this.closeCompletion();"),("if(e.key==='Escape'){this.findBar.hidden=true;","if(e.key==='Escape'){this.cancelCompositionAssistance();this.findBar.hidden=true;"),('this.compositionTimer=0;this.compositionResume=null;','this.compositionTimer=0;this.compositionResume=null;this.compositionMode=null;')]
                  for before,after in pairs:
                      assert main.count(before)==1, before
                      main=main.replace(before,after)
                  assert main.count('  cancelCompositionAssistance(){')==1
                  Path(path).write_text(main)
              else: raise RuntimeError('Unreviewed authored conflict: '+path)
              subprocess.run(['git','add','--',path],check=True)
          assert Path('.git/MERGE_HEAD').exists()
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          PY
          git apply --check .rendering-acceptance.patch
          git apply .rendering-acceptance.patch
          npm run build && npm test
          git rm .rendering-acceptance.patch
          git add README.md src tests tools dist examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'merge(rendering): preserve scalar runtime and composition handling with complete pixel evidence'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-acceptance-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-acceptance-source
          path: /tmp/rendering-acceptance-source.bundle
          retention-days: 7
