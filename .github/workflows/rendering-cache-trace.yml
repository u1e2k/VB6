name: Trace rendering cache invalidation
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-cache-trace.yml]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Trace the unchanged eight-mutation scenario
        run: |
          python - <<'PY'
          import functools, http.server, json, threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          root = Path.cwd()
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), functools.partial(Quiet, directory=root))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          flags = ['--no-sandbox','--enable-unsafe-webgpu','--enable-unsafe-swiftshader','--use-angle=swiftshader','--use-vulkan=swiftshader','--disable-partial-raster','--run-all-compositor-stages-before-draw','--enable-gpu','--ignore-gpu-blocklist','--enable-features=Vulkan','--use-webgpu-adapter=swiftshader','--disable-vulkan-surface','--disable-gpu-rasterization']
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=flags, ignore_default_args=['--hide-scrollbars'])
                  try:
                      page = browser.new_page(viewport={'width':1280,'height':800}, device_scale_factor=1)
                      page.goto(f'http://127.0.0.1:{server.server_port}/tests/fixtures/rendering.html')
                      page.add_script_tag(content=(root/'dist/vb6-rendering.js').read_text())
                      page.evaluate('''async()=>{
                        document.body.innerHTML='<style>#label{font:16px monospace;width:160px;height:30px;background:rgb(10,20,30)}body:has(#label:empty) #peer{background:rgb(40,50,60)}#peer{width:30px;height:30px;background:rgb(70,80,90)}</style><div id="label">First</div><div id="peer"></div><div id="rtl" dir="auto">English</div>';
                        window.trace=[];window.phase='startup';
                        const record=(kind,detail)=>{if(trace.length<100)trace.push({kind,phase,time:performance.now(),detail});};
                        const NativeRO=window.ResizeObserver;
                        window.ResizeObserver=class extends NativeRO{constructor(callback){super((entries,observer)=>{record('resize',entries.map(e=>({tag:e.target.tagName,id:e.target.id,width:e.contentRect.width,height:e.contentRect.height})));callback(entries,observer);});}};
                        for(const type of ['load','error','input','change','focusin','focusout','pointerover','pointerout','pointerleave','selectionchange','visibilitychange','resize','scroll','loadingdone']){
                          document.addEventListener(type,e=>record('event',{type,target:e.target?.id||e.target?.nodeName}),true);
                          if(type==='resize'||type==='scroll')window.addEventListener(type,e=>record('window',{type}),true);
                        }
                        document.fonts.addEventListener('loadingdone',()=>record('font',document.fonts.status));
                        window.r=new VB6Rendering.UIRenderer(document,{backend:'webgpu',fallbacks:['html']});
                        let dirty=r.stylesDirty;
                        Object.defineProperty(r,'stylesDirty',{configurable:true,get(){return dirty;},set(value){if(value)record('dirty',{previous:dirty,stack:new Error().stack});dirty=value;}});
                        const invalidate=r.adapter.invalidateStyles;
                        r.adapter.invalidateStyles=function(...args){record('invalidateStyles',{args:args.map(n=>n?.id||n?.nodeName),stack:new Error().stack});return invalidate.apply(this,args);};
                        await r.ready;
                        if(r.backend!=='webgpu')throw Error(JSON.stringify(r.getStats()));
                        for(let i=0;i<5;i++)await new Promise(requestAnimationFrame);
                      }''')
                      startup=(root/'tests/fixtures/rendering-startup.mjs').read_text().replace('export default ','',1)
                      print('STARTUP', json.dumps(page.evaluate('('+startup+')(window.r)')), flush=True)
                      result=page.evaluate('''async()=>{
                        const label=document.querySelector('#label');const initial=r.adapter.style(label),start=r.metrics.textStyleReuses;
                        const settle=async()=>{for(let i=0;i<5;i++)await new Promise(requestAnimationFrame)};
                        const retained=[];
                        for(let i=0;i<8;i++){
                          window.phase='mutation-'+i;
                          if(i%2)label.firstChild.data=i%4===1?'Other':'First';else label.textContent=i%4===0?'First':'Other';
                          await settle();retained.push(r.adapter.style(label)===initial);
                        }
                        const result={active:r.backend,styleReuses:r.metrics.textStyleReuses-start,retained,trace};r.dispose();return result;
                      }''')
                      print('CACHE_TRACE', json.dumps(result,ensure_ascii=True,indent=2), flush=True)
                  finally:
                      browser.close()
          finally:
              server.shutdown();server.server_close()
          PY
