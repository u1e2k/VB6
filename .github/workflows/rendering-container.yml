name: UI rendering container
on:
  pull_request:
  push:
    branches: [main, feat/webgpu-ui-rendering]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rendering-container-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gpu:
    # Independent software-driver correctness coverage on a lightweight runner.
    # No physical-GPU speed or whole-IDE performance certification is inferred.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#single-cpu-runners
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
        display: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Install software-driver presentation libraries
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve browser executable
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print('CHROMIUM_PATH='+p.chromium.executable_path)
          PY
      - name: Required backend execution, strict readback and presentation pixels
        env:
          REQUIRED_BACKEND: ${{ matrix.backend }}
          DISPLAY_MODE: ${{ matrix.display }}
          RENDERING_BROWSER_FLAGS: --enable-gpu --enable-features=Vulkan --ignore-gpu-blocklist
        run: |
          args=()
          if [ "$DISPLAY_MODE" = headed ]; then args+=(--headed); fi
          xvfb-run -a python tools/browser-rendering-tests.py --require-$REQUIRED_BACKEND --software-gpu "${args[@]}"
      - name: Complete case execution and reproducible distributions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/rendering/report.json').read_text())
          assert report['summary']=={'passed':30,'failed':0,'skipped':0}, report['summary']
          PY
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-container-${{ matrix.backend }}-${{ matrix.display }}
          path: reports/rendering
          retention-days: 14
