name: Materialize reviewed rendering sources
on:
  push:
    branches: [feat/webgpu-ui-rendering]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rendering-development-materialization
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/feat/webgpu-ui-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply the locally reviewed source patch
        shell: bash
        run: |
          # Temporary binary transport only; final commit contains readable source.
          python - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          parts = sorted(Path('.rendering-transfer').glob('*.part'))
          assert len(parts) == 5
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == 'ba143dff243016939387b3d1d3f331a0b757f6c13b718de7294a17f62b63f313'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '482e6628bda8d3afb548d28649ddd0837071d73afee818bca3b8ed387e8baa21'
          Path('/tmp/rendering-source.patch').write_bytes(patch)
          PY
          # Workflow files are already installed through the repository connector.
          # The Actions token intentionally does not modify workflow definitions.
          git apply --check --exclude=.github/workflows/rendering.yml /tmp/rendering-source.patch
          git apply --exclude=.github/workflows/rendering.yml /tmp/rendering-source.patch
      - name: Rebuild combined distributions and run the full Node regression suite
        run: npm run build && npm test
      - name: Commit normal source and generated artifacts to the feature branch
        shell: bash
        run: |
          git rm -r .rendering-transfer
          git add .gitignore package.json src/rendering src/ide/ide-tools.js src/mcp/studio-entry.js src/runtime/entry.js src/runtime/host.js src/exporter/runtime-payload.js tools/build.mjs tests/rendering-policy.test.mjs tools/browser-rendering-tests.py docs/RENDERING.md dist examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rendering): add WebGPU-first hybrid UI renderer, configurable fallbacks and validation'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git archive --format=tar.gz -o /tmp/vb6-rendering-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/rendering-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-rendering-source
          path: |
            /tmp/vb6-rendering-source.tar.gz
            /tmp/rendering-head.txt
          retention-days: 7
