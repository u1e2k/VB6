name: Rendering final integration
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-final-integration.yml]
permissions:
  contents: write
concurrency:
  group: rendering-final-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile pinned main and independently reproduce reviewed source
        shell: bash
        run: |
          mkdir -p /tmp/rendering-final-integration
          git bundle create /tmp/rendering-final-integration/before.bundle HEAD refs/remotes/origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/feat/webgpu-ui-rendering | cut -f1)" = '${{ github.sha }}'
          git merge --no-commit --no-ff 3df8dcc6227fbf734c5c7710b0e29ec06c43b210 > /tmp/rendering-final-integration/merge.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          assert Path('.git/MERGE_HEAD').read_text().strip()=='3df8dcc6227fbf734c5c7710b0e29ec06c43b210'
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          source={'package.json':'9887118539e395332afe9337ce4e0dbf2a925a97','src/ide/ide-tools.js':'d516cfd8a22d8a78c7ab2f07f9d4fe43533730cb','src/ide/ide.css':'5970e145806b0ceaa68376af41c90b641d36d374','src/ide/main.js':'2fd3b5bd2d930dea9e6585c25dfec2b6b87a978f'}
          generated={'src/exporter/runtime-payload.js','dist/VB6-Studio-Web.html','dist/studio.js','dist/studio.css','dist/vb6-runtime.js'}|{f'dist/examples/{name}.html' for name in ['calculator','clock','compatibility','controls','data','events','graphics','graphql-customers','language','mdi','orders','rest-customers','rest-public-users','richtext','sqlite-customers','win32']}
          assert set(conflicts)==set(source)|generated,conflicts
          pat=re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> 3df8dcc6227fbf734c5c7710b0e29ec06c43b210\n',re.M|re.S)
          for file in conflicts:
              if file in generated:
                  subprocess.run(['git','checkout','--ours','--',file],check=True)
              elif file=='package.json':
                  ours=json.loads(subprocess.check_output(['git','show',f':2:{file}'],text=True))
                  theirs=json.loads(subprocess.check_output(['git','show',f':3:{file}'],text=True))
                  assert all(key not in ours['scripts'] or ours['scripts'][key]==val for key,val in theirs['scripts'].items())
                  ours['scripts'].update(theirs['scripts'])
                  for key,val in theirs.items():
                      if key!='scripts': assert ours.get(key)==val,key
                  Path(file).write_text(json.dumps(ours,indent=2)+'\n')
              else:
                  def replace(m):
                      ours,theirs=m.groups()
                      if file!='src/ide/ide-tools.js' or ours.startswith('import '): return ours+theirs
                      assert 'const renderingOptions=createRenderingOptions(ide);' in ours
                      needle='Object.assign(settings,{errorTrapping:errorTrapping.value'
                      assert ours.count(needle)==1
                      return ours.replace(needle,"validateLayout({...ide.project,settings:{...settings,anchoring:value('anchoring')}},false);Object.assign(settings,{anchoring:value('anchoring'),errorTrapping:errorTrapping.value")
                  text,n=pat.subn(replace,Path(file).read_text())
                  assert n==(2 if file=='src/ide/ide-tools.js' else 1),file
                  assert '<<<<<<<' not in text
                  Path(file).write_text(text)
              if file in source:
                  assert subprocess.check_output(['git','hash-object',file],text=True).strip()==source[file],file
              subprocess.run(['git','add','--',file],check=True)
          # Only workflows already reviewed and merged on main may be introduced.
          workflows=subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows'],text=True).splitlines()
          assert set(workflows)=={'.github/workflows/anchoring-layout.yml','.github/workflows/compute.yml'},workflows
          subprocess.run(['git','diff','--cached','--exit-code','3df8dcc6227fbf734c5c7710b0e29ec06c43b210','--',*workflows],check=True)
          PY
          npm run build > /tmp/rendering-final-integration/build.log 2>&1
          npm test > /tmp/rendering-final-integration/tests.log 2>&1
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
          cp .git/index /tmp/rendering-final-integration/nohelper.index
          GIT_INDEX_FILE=/tmp/rendering-final-integration/nohelper.index git update-index --force-remove .github/workflows/rendering-final-integration.yml
          tree=$(GIT_INDEX_FILE=/tmp/rendering-final-integration/nohelper.index git write-tree)
          test "$tree" = '87ff59732d6a28ad735a4fa1b499defdaccbd910'
          printf '%s\n' "$tree" > /tmp/rendering-final-integration/reviewed-tree.txt
          git commit -m 'merge(rendering): preserve anchoring and compute with integrated Options and rebuilt bundles'
          git bundle create /tmp/rendering-final-integration/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/rendering-final-integration/head.txt
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-final-integration-source
          path: /tmp/rendering-final-integration
          retention-days: 7
