name: Final dual-renderer integration
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-final-integration.yml]
permissions:
  contents: write
concurrency:
  group: rendering-final-integration
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge the locally tested source combination
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/feat/webgpu-ui-rendering | cut -f1)" = '${{ github.sha }}'
          git merge --no-commit --no-ff 5ad8ea7815877347230dda6e5254ada4181aa61c || true
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          assert Path('.git/MERGE_HEAD').exists(), 'Expected pinned integration'
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts) <= {'dist/VB6-Studio-Web.html','dist/studio.js'}, conflicts
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          PY
          mkdir -p /tmp/rendering-final-integration
          npm run build > /tmp/rendering-final-integration/build.log 2>&1
          npm test > /tmp/rendering-final-integration/tests.log 2>&1
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'merge(rendering): preserve agent workbench and rebuild combined distributions'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git rev-parse HEAD > /tmp/rendering-final-integration/head.txt
          git bundle create /tmp/rendering-final-integration/repository.bundle HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-final-integrated-source
          path: /tmp/rendering-final-integration
          retention-days: 7
