name: Recover current rendering integration
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-finalize.yml]
permissions:
  contents: read
concurrency:
  group: rendering-final-source
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact reviewed refs for conflict-safe integration
        run: |
          git fetch origin main
          git bundle create /tmp/rendering-resume.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD origin/main > /tmp/rendering-resume-refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-resume-exact-refs
          path: |
            /tmp/rendering-resume.bundle
            /tmp/rendering-resume-refs.txt
          retention-days: 7
