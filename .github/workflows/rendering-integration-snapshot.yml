name: Rendering integration snapshot
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-integration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact renderer and main source histories
        run: |
          mkdir -p /tmp/rendering-integration
          git fetch origin main
          git bundle create /tmp/rendering-integration/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD origin/main > /tmp/rendering-integration/refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-integration-snapshot
          path: /tmp/rendering-integration
          retention-days: 3
