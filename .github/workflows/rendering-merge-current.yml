name: Reconcile renderer merge candidate
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-merge-current.yml]
permissions:
  contents: write
concurrency:
  group: rendering-merge-current
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve current branch and integrate pinned main
        shell: bash
        run: |
          mkdir -p /tmp/rendering-merge-current
          git bundle create /tmp/rendering-merge-current/before.bundle HEAD refs/remotes/origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/feat/webgpu-ui-rendering | cut -f1)" = '${{ github.sha }}'
          git merge --no-commit --no-ff 4cc9031c37a294710bf436373cbdb6e25005958b || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert Path('.git/MERGE_HEAD').exists(), 'Expected pinned integration'
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts) <= {'dist/VB6-Studio-Web.html','dist/studio.js'}, conflicts
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          PY
          npm run build > /tmp/rendering-merge-current/build.log 2>&1
          npm test > /tmp/rendering-merge-current/tests.log 2>&1
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'merge(rendering): preserve agent hunk review and rebuild integrated renderer'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git rev-parse HEAD > /tmp/rendering-merge-current/head.txt
          git bundle create /tmp/rendering-merge-current/repository.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-merge-current-source
          path: /tmp/rendering-merge-current
          retention-days: 7
