name: Rendering merge handoff
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-merge-handoff.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git bundle create /tmp/rendering-final-refs.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-final-refs
          path: /tmp/rendering-final-refs.bundle
          retention-days: 3
