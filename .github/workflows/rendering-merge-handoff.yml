name: Integrate final agent recovery main
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-merge-handoff.yml]
permissions:
  contents: write
concurrency:
  group: rendering-reconcile-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve newly merged recovery and diagnostics changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff bd4f9cfbb753cf18cdc78d89744f31789a6e5b28 || true
          python - <<'PY'
          from pathlib import Path
          import subprocess
          assert Path('.git/MERGE_HEAD').exists()
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          assert set(conflicts)<={'dist/VB6-Studio-Web.html','dist/studio.js','src/exporter/runtime-payload.js'}, conflicts
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          PY
          npm run build && npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'merge: retain agent recovery and diagnostics lifecycle in dual-renderer release'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-final-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-final-source
          path: /tmp/rendering-final-source.bundle
          retention-days: 7
