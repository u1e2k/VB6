name: Rendering merge snapshot
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-merge-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot current source history
        run: |
          git fetch origin main
          mkdir -p /tmp/rendering-merge-snapshot
          git bundle create /tmp/rendering-merge-snapshot/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD origin/main > /tmp/rendering-merge-snapshot/refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-merge-snapshot
          path: /tmp/rendering-merge-snapshot
          retention-days: 3
