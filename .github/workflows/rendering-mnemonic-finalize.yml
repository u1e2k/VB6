name: Publish deterministic classic mnemonic paint
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-mnemonic.patch, .github/workflows/rendering-mnemonic-finalize.yml]
permissions:
  contents: write
concurrency:
  group: rendering-mnemonic-source
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed paint correction and rebuild applications
        run: |
          echo '38e928420e49238aed92ceb678f1507464c3f740f59420abe33da1c8520d6daa  .rendering-mnemonic.patch' | sha256sum --check
          git apply --check .rendering-mnemonic.patch
          git apply .rendering-mnemonic.patch
          npm run build && npm test
          git rm .rendering-mnemonic.patch
          git add src/theme/bevels.css tests/rendering-live.test.mjs tools/browser-rendering-tests.py dist src/exporter/runtime-payload.js examples
          git diff --cached --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): stabilize classic mnemonic pixels without changing glyphs or layout'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-mnemonic-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-mnemonic-source
          path: /tmp/rendering-mnemonic-source.bundle
          retention-days: 7
