name: Publish reviewed renderer and OCX integration
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-ocx-integration.yml]
permissions:
  contents: write
concurrency:
  group: rendering-ocx-integration
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge pinned main with reviewed export and fingerprint resolution
        shell: bash
        run: |
          mkdir -p /tmp/rendering-ocx-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff b70becd023f4b72122ed0e193830f098349c845a || true
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          assert Path('.git/MERGE_HEAD').exists()
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts)=={'src/runtime/entry.js','tools/ide-artifacts.json'}, conflicts
          p='src/runtime/entry.js'
          for stage,sha in [(2,'cdafb90e3c3d4ba438b9a55b41e36a64a0d66f85'),(3,'3c65b9c9b4ebdb349834bb8a27b2e6621d08c9aa')]:
              assert subprocess.check_output(['git','rev-parse',f':{stage}:{p}'],text=True).strip()==sha
          text=subprocess.check_output(['git','show',f':3:{p}'],text=True)
          imports="import {UIRenderer, retainRenderer, rendererForDocument} from '../rendering/renderer.js';\nimport {normalizeRendering, DEFAULT_RENDERING} from '../rendering/policy.js';\n"
          assert text.count('export const RuntimeAPI={')==1
          Path(p).write_text(imports+text.replace('export const RuntimeAPI={','export const RuntimeAPI={UIRenderer,retainRenderer,rendererForDocument,normalizeRendering,DEFAULT_RENDERING,'))
          # Exact fingerprints reviewed in the local source build. CI only verifies
          # these expectations; it never computes replacement expectations.
          manifest=json.loads('''{"version":2,"files":{"dist/studio.js":{"bytes":5972133,"sha256":"a6b4260821e26c9ab66f48a098ed9c0a250e87ff515bb38c5cb2b5a5dcf9f526"},"dist/VB6-Studio-Web.html":{"bytes":6127799,"sha256":"eb4c418211c69dc2059773a2f54ee1e375ecd31cd94c4ffcd667f509b65b0b84"},"dist/vb6-runtime.js":{"bytes":2135199,"sha256":"893d5f204b9fae7dadacc4a7281635b30887648e4ead6bb22d40b3927347640d"},"src/exporter/runtime-payload.js":{"bytes":2214965,"sha256":"e5d8cd3e9c68a34d3478150a3bf3d943bc4734badbd18fd1fa8711df72f28b9f"},"dist/OCX-Source-Control-Lab.html":{"bytes":2147314,"sha256":"ccb20604f1ef1c3e7a60a3e6510282b71dde31906e3130696838df630fc9e8e5"},"dist/examples/orders.html":{"bytes":2214920,"sha256":"d62431cba82dab993e295c0b7d4c3e27f16989f4d164a31a716b5595a07ecd53"},"dist/examples/calculator.html":{"bytes":2209237,"sha256":"1aa959a173ca34c4f19c6710e569f06301f510866ce21f148aeb27c85a913f62"},"dist/examples/clock.html":{"bytes":2202885,"sha256":"fc3a0a604c5d55578049a9ab616bae5805febfffa20676a8b3fb217d084aea47"},"dist/examples/graphics.html":{"bytes":2202600,"sha256":"184e411d7ad4448030777e98dfbb4d839ae17c5b41c1a00e30116bd031d1b07f"},"dist/examples/data.html":{"bytes":2204749,"sha256":"f1c086cc0456e71f68442d58cea743b87643918d97a5bec416f96c32b1a9443f"},"dist/examples/controls.html":{"bytes":2205170,"sha256":"fe0ed8b8c03c092f3ac3ad80a962cfaa5ffc4bc40b2e7a1e2bf0032692d5b77e"},"dist/examples/language.html":{"bytes":2200851,"sha256":"a3206e271018487d12deb3326078f7ba8ac350a7b3985426854aada961af1d60"},"dist/examples/events.html":{"bytes":2205629,"sha256":"682daae5a5b440f961cc78844aa9d19078dae261f3fd6c2785cda92bc54a442e"},"dist/examples/richtext.html":{"bytes":2208364,"sha256":"d99c7588fdf06a4905ff1dc035647e79caa36229eff8c50e46a81f4c1975a254"},"dist/examples/compatibility.html":{"bytes":2210465,"sha256":"02415bbf17cc39d68347f537572d61e68cbc4c1b527e986bc5c6ac692dcfcd7c"},"dist/examples/mdi.html":{"bytes":2205623,"sha256":"510c60d74e4406a92dfece389f82568c6ff07f9979a84a714e1e3478033b1e8e"},"dist/examples/sqlite-customers.html":{"bytes":2207810,"sha256":"de1d4931b27da1b0fc4889c599d0a2eaeb7dfb709a5dbbf89e1f4ae3cec5b49e"},"dist/examples/rest-customers.html":{"bytes":2207626,"sha256":"ae6d3fcbf64166fa9753d141bc4cf4134e1b3777ba016138c634e43586907e06"},"dist/examples/rest-public-users.html":{"bytes":2207407,"sha256":"168bcb7c1a4d586eeb3fa001fc554df022ead865dc50f17700c181924d2db1c1"},"dist/examples/graphql-customers.html":{"bytes":2207532,"sha256":"c02a17fdfd7d04a10606c53e7f30d4ebae873f5421ca5a155b3beeebe4b9cb7f"},"dist/examples/win32.html":{"bytes":2216641,"sha256":"bfe43723c0c5f88c4962b09e496085e67857d654ad9479b7cee12c075d193b5c"},"dist/examples/win32-files.html":{"bytes":2207106,"sha256":"e909abb679cb7759b5f67054e1c6167122fba8cad355da64cc817abcd6fa57bb"},"dist/examples/win32-text.html":{"bytes":2204595,"sha256":"2a0f1051a6d416dcdaa38617ab98d34f25691d86f122b13ce087e5912ff8794d"},"dist/examples/win32-sync.html":{"bytes":2204800,"sha256":"16dc32c24c3d9e1884a9ea50f9a8cb581329af9cbb7786eed22b8a0e5cb45777"},"dist/examples/win32-registry.html":{"bytes":2205557,"sha256":"c289e370824b1d4a1f6d17ea2a48450aa09f30688b504c95546aed7589df3d9b"},"dist/examples/win32-guid.html":{"bytes":2204947,"sha256":"eb3e921f96e92527eff7406fb24b509ddab1caa2ea494af84205bdbdb2eaef4f"},"dist/examples/win32-properties.html":{"bytes":2204630,"sha256":"8f17f6e69e3e600607428daae74222dbcbc1bbb1b987449ab366702af91b6bb8"}}}''')
          Path('tools/ide-artifacts.json').write_text(json.dumps(manifest,indent=2)+'\n')
          expected={'src/runtime/entry.js':'e14c70681a915394ff63d87920773d9e6564ceb6','src/ide/main.js':'867c956ceabae8b012a57cd95665816d6796568c','tools/build.mjs':'6306b1c6c389744c6e71f4a3a9c285194e02fe62','tools/ide-artifacts.json':'8b895cbbcb832279de78bc2a691eff1300c4aa1e'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          subprocess.run(['git','add','src/runtime/entry.js','tools/ide-artifacts.json'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          PY
          npm run build > /tmp/rendering-ocx-integration/build.log 2>&1
          npm test > /tmp/rendering-ocx-integration/tests.log 2>&1
          git diff --exit-code -- dist src/editor/diagnostics-payload.js examples
          git diff --check
          git commit -m 'merge(rendering): preserve OCX source controls, container contracts and both public APIs'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git rev-parse HEAD > /tmp/rendering-ocx-integration/head.txt
          git bundle create /tmp/rendering-ocx-integration/repository.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-ocx-integration
          path: /tmp/rendering-ocx-integration
          retention-days: 7
