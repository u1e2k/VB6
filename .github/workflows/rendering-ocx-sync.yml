name: Final rendering source verification
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-ocx-sync.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the complete integrated source and reproduce distributions
        run: |
          mkdir -p /tmp/rendering-final-review
          git rev-parse HEAD origin/main > /tmp/rendering-final-review/refs.txt
          npm run build > /tmp/rendering-final-review/build.log 2>&1
          npm test > /tmp/rendering-final-review/tests.log 2>&1
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git bundle create /tmp/rendering-final-review/repository.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-final-merge-review
          path: /tmp/rendering-final-review
          retention-days: 7
