name: Diagnose final rendering unit failure
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-ocx-sync.yml]
permissions:
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract failing TAP test and stack from the known failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,re,urllib.request
          from pathlib import Path
          request=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/actions/jobs/112255715159/logs',headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          # A signed storage redirect authenticates itself; never forward the
          # GitHub API Authorization header to that other origin.
          request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
          with urllib.request.urlopen(request,timeout=30) as response:
              lines=response.read().decode('utf-8','replace').splitlines()
          indices=[i for i,line in enumerate(lines) if re.search(r'\bnot ok\b|# fail |ERR_ASSERTION|error:|failureType:',line)]
          keep=set()
          for i in indices:
              keep.update(range(max(0,i-4),min(len(lines),i+45)))
          report='\n'.join(lines[i] for i in sorted(keep))+'\n'
          assert indices, 'Expected failing test diagnostics in the known failed job'
          Path('/tmp/rendering-unit-failure.txt').write_text(report)
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-unit-failure-diagnostic
          path: /tmp/rendering-unit-failure.txt
          retention-days: 7
