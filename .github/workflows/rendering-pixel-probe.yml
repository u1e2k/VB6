name: GPU pixel boundary probe
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.github/workflows/rendering-pixel-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0 Pillow && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print('CHROMIUM_PATH='+p.chromium.executable_path)
          PY
      - run: xvfb-run -a python tools/rendering-pixel-probe.py --require-webgpu --software-gpu --headed
        env:
          RENDERING_BROWSER_FLAGS: --enable-gpu --enable-features=Vulkan --ignore-gpu-blocklist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failing-frame-pixel-probe
          path: reports/rendering
          retention-days: 7
