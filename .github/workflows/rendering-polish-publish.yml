name: Publish reviewed renderer corrections
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-polish.patch.xz, .github/workflows/rendering-polish-publish.yml]
permissions:
  contents: write
concurrency:
  group: rendering-polish-publication
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile reviewed main and apply validated source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 6aeeae789151397c58648cd9d99678105935979f || true
          python3 - <<'PY'
          import hashlib,lzma,subprocess
          from pathlib import Path
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          assert set(conflicts)<= {'dist/VB6-Studio-Web.html','dist/studio.js'}, conflicts
          for path in conflicts:
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          assert Path('.git/MERGE_HEAD').exists()
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          patch=lzma.decompress(Path('.rendering-polish.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='64ec8943f9092db6fb71a2f614ea6026da7872f326fc9389259f501bb9f0704d'
          Path('/tmp/rendering-polish.patch').write_bytes(patch)
          PY
          git apply --check /tmp/rendering-polish.patch
          git apply /tmp/rendering-polish.patch
          npm run build && npm test
      - name: Publish ordinary sources and deterministic bundles
        run: |
          git rm .rendering-polish.patch.xz
          git add src tests tools dist examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'fix(rendering): correct alpha and page backgrounds, isolate native borders and reuse text paint styles'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-polish-source.bundle HEAD
          git rev-parse HEAD > /tmp/rendering-polish-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-polish-source
          path: |
            /tmp/rendering-polish-source.bundle
            /tmp/rendering-polish-head.txt
          retention-days: 7
