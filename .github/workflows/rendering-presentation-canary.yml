name: Diagnose WebGPU presentation
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [tools/rendering-presentation-canary.py, .github/workflows/rendering-presentation-canary.yml]
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.63.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - run: xvfb-run -a python tools/rendering-presentation-canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-presentation-canary
          path: reports/presentation-canary
          retention-days: 7
