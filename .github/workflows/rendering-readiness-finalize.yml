name: Integrate reviewed rendering readiness fixes
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-readiness.patch.xz, .github/workflows/rendering-readiness-finalize.yml]
permissions:
  contents: write
concurrency:
  group: rendering-readiness-publication
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile pinned current main and apply reviewed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 5e9a3191ff04d00b13e4f100c48e219a836b7a4b || true
          python3 - <<'PY'
          import hashlib,lzma,subprocess
          from pathlib import Path
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          if 'README.md' in conflicts:
              ours=subprocess.check_output(['git','show',':2:README.md']).decode()
              theirs=subprocess.check_output(['git','show',':3:README.md']).decode()
              base=subprocess.check_output(['git','show','f4ee8d47bed69ae26b65d20637b8f5f8da13d815:README.md']).decode()
              marker='### Advanced browser Win32 GDI'
              assert theirs.split(marker)[0].rstrip()==base.rstrip()
              assert theirs.count(marker)==1 and marker not in ours
              Path('README.md').write_text(ours.rstrip()+'\n\n'+marker+theirs.split(marker)[1])
              subprocess.run(['git','add','README.md'],check=True)
              conflicts.remove('README.md')
          assert all(p.startswith('dist/') or p=='src/exporter/runtime-payload.js' for p in conflicts), conflicts
          for p in conflicts:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          assert Path('.git/MERGE_HEAD').exists()
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          patch=lzma.decompress(Path('.rendering-readiness.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='264eea23aeedd2c4721b9b9c1b79dc8e2ca73de621ceea62b3bc12027b4fa877'
          Path('/tmp/readiness.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/readiness.patch
          git apply --unidiff-zero /tmp/readiness.patch
          npm run build && npm test
      - name: Publish ordinary sources and reproducible applications
        run: |
          git rm .rendering-readiness.patch.xz
          git add src tests tools desktop/studio.mjs dist examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'fix(rendering): eliminate resize feedback, preserve page lifecycle and harden preview integration'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-readiness-source.bundle HEAD
          git rev-parse HEAD > /tmp/rendering-readiness-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-readiness-source
          path: |
            /tmp/rendering-readiness-source.bundle
            /tmp/rendering-readiness-head.txt
          retention-days: 7
