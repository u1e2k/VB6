name: Validate rendering GPU fixes
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-fix.patch, .github/workflows/rendering-rebuild.yml]
permissions:
  contents: write
jobs:
  fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed fixes and regenerate distributions
        run: |
          echo '9c0645a6c6b09f56ed23e01eb04936b15bc4c1dfba7f852af7ce3733cae90676  .rendering-fix.patch' | sha256sum --check
          git apply --check .rendering-fix.patch
          git apply .rendering-fix.patch
          npm run build
          npm test
          git rm .rendering-fix.patch
          git add src/rendering/webgpu.js tools/browser-rendering-tests.py dist src/exporter/runtime-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): validate WGSL identifiers and isolate real-GPU test contexts'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git rev-parse HEAD > /tmp/rendering-head.txt
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Resolve browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - run: npm run test:rendering:gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-gpu-fix-evidence
          path: |
            reports/rendering
            /tmp/rendering-head.txt
          retention-days: 14
