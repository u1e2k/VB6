name: Validate rendering GPU fixes
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-fix.patch, .github/workflows/rendering-rebuild.yml]
permissions:
  contents: write
jobs:
  fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed framebuffer diagnostics
        run: |
          echo 'ec683687c166e3b9bc18ffd33d8fdb6d95e7ec27b16a2cf83dda556cd351c440  .rendering-fix.patch' | sha256sum --check
          git apply --check .rendering-fix.patch
          git apply .rendering-fix.patch
          npm run build
          npm test
          git rm .rendering-fix.patch
          git add tools/browser-rendering-tests.py dist src/exporter/runtime-payload.js examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(rendering): verify GPU framebuffer independently of compositor screenshots'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git rev-parse HEAD > /tmp/rendering-head.txt
          git archive --format=tar.gz -o /tmp/rendering-source.tar.gz HEAD
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Resolve browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - run: npm run test:rendering:gpu
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-framebuffer-evidence
          path: |
            reports/rendering
            /tmp/rendering-head.txt
            /tmp/rendering-source.tar.gz
          retention-days: 14
