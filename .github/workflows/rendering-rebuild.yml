name: Finalize rendering evidence reporting
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-fix.patch, .github/workflows/rendering-rebuild.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed reporting-only correction
        run: |
          echo 'd544e7b3507c599e6de0bab1c155f4d603f1ca3c0e45d6dcd5ae383bb0bdf2d8  .rendering-fix.patch' | sha256sum --check
          git apply --check .rendering-fix.patch
          git apply .rendering-fix.patch
          python -m py_compile tools/browser-rendering-tests.py
          git rm .rendering-fix.patch
          git add tools/browser-rendering-tests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(rendering): distinguish skipped GPU comparisons from passing tests'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
