name: Integrate reviewed rendering lifecycle correction
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-resize.xz, .github/workflows/rendering-resize-integrate.yml]
permissions:
  contents: write
concurrency:
  group: rendering-reviewed-integration
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile the reviewed issue-39 visual and portable-build changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 728a9201806a4d455113867d2778c3262666a05b || true
          python - <<'PY'
          import subprocess,hashlib,lzma
          from pathlib import Path
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          for path in conflicts:
              if path.startswith(('dist/','examples/')) or path in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']:
                  subprocess.run(['git','checkout','--ours','--',path],check=True)
              elif path=='tools/build.mjs':
                  main=subprocess.check_output(['git','show','728a9201806a4d455113867d2778c3262666a05b:tools/build.mjs']).decode()
                  marker="fs.writeFileSync('dist/vb6-native.js',"
                  assert main.count(marker)==1
                  rendering="fs.writeFileSync('dist/vb6-rendering.js',bundle(path.resolve('src/rendering/entry.js'),'VB6Rendering'));\n"
                  Path(path).write_text(main.replace(marker,rendering+marker))
              else:
                  raise RuntimeError('Unreviewed authored conflict: '+path)
              subprocess.run(['git','add','--',path],check=True)
          assert Path('.git/MERGE_HEAD').exists()
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows'],check=True)
          patch=lzma.decompress(Path('.rendering-resize.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest()=='6a24f8fe58716ab0fd7356d8112f47396c6d25dbc13df1226dbc970c18dbc60b'
          Path('/tmp/rendering-resize.patch').write_bytes(patch)
          PY
          git apply --check /tmp/rendering-resize.patch
          git apply /tmp/rendering-resize.patch
          npm run build && npm test
      - name: Publish normal source and reproducible distributions
        run: |
          git rm .rendering-resize.xz
          git add src/rendering/renderer.js tests/rendering-resize.test.mjs tools/browser-rendering-tests.py tools/verify-rendering-report.py dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'fix(rendering): defer resize targets safely and retain current visual fidelity changes'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git bundle create /tmp/rendering-current.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/rendering-current-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-current-reviewed-source
          path: |
            /tmp/rendering-current.bundle
            /tmp/rendering-current-head.txt
          retention-days: 7
