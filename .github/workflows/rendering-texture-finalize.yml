name: Finalize retained texture sources
on:
  push:
    branches: [feat/webgpu-ui-rendering]
    paths: [.rendering-texture.patch, .github/workflows/rendering-texture-finalize.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed texture correction and rebuild shipped applications
        run: |
          echo '78f8e9780944d9f5ebdd1dca8b2268520d1f63bc2555287ee166ca3aaa3fe191  .rendering-texture.patch' | sha256sum --check
          git apply --check .rendering-texture.patch
          git apply .rendering-texture.patch
          npm run build && npm test
          git rm .rendering-texture.patch
          git add src tests tools dist examples
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rendering): upload replaced texture sources without rebuilding retained geometry'
          git push origin HEAD:refs/heads/feat/webgpu-ui-rendering
          git archive --format=tar.gz -o /tmp/rendering-tested-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/rendering-tested-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-texture-tested-source
          path: |
            /tmp/rendering-tested-source.tar.gz
            /tmp/rendering-tested-head.txt
          retention-days: 7
