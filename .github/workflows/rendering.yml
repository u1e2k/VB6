name: UI rendering
on:
  pull_request:
  push:
    branches: [main, feat/webgpu-ui-rendering]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rendering-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  webgpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        display: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && node --test tests/rendering-*.test.mjs
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Install software Vulkan presentation dependencies
        # Reference investigation: https://github.com/vercel-labs/vgpu/issues/109
        # This is a software-GPU correctness job, never hardware qualification.
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve test browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Actual software-GPU execution, exact framebuffer and presentation pixels
        env:
          DISPLAY_MODE: ${{ matrix.display }}
          RENDERING_BROWSER_FLAGS: --enable-features=Vulkan --use-angle=vulkan --use-webgpu-adapter=swiftshader --disable-vulkan-surface
        run: |
          if [ "$DISPLAY_MODE" = headed ]; then
            xvfb-run -a python tools/browser-rendering-tests.py --require-webgpu --software-gpu --headed
          else
            python tools/browser-rendering-tests.py --require-webgpu --software-gpu
          fi
      - name: Verify reproducible generated distributions
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-pixels-and-metrics-${{ matrix.display }}
          path: reports/rendering
          retention-days: 14
