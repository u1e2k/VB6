name: UI rendering
on:
  pull_request:
  push:
    branches: [main, feat/webgpu-ui-rendering]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rendering-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
        display: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python -m playwright install --with-deps chromium
      - name: Install software Vulkan presentation dependencies
        # First-party investigation: https://github.com/vercel-labs/vgpu/issues/109
        # These are software-GPU correctness jobs, never hardware qualification.
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve test browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Required GPU execution, exact framebuffer and presentation pixels
        env:
          DISPLAY_MODE: ${{ matrix.display }}
          REQUIRED_BACKEND: ${{ matrix.backend }}
        run: |
          # Coherent Vulkan presentation can disable WebGL2 in Chromium. Test
          # each API with its own driver configuration, never as a fallback pass.
          if [ "$REQUIRED_BACKEND" = webgpu ]; then
            export RENDERING_BROWSER_FLAGS='--enable-features=Vulkan --use-angle=vulkan --use-webgpu-adapter=swiftshader --disable-vulkan-surface'
          fi
          if [ "$DISPLAY_MODE" = headed ]; then
            xvfb-run -a python tools/browser-rendering-tests.py --require-$REQUIRED_BACKEND --software-gpu --headed
          else
            python tools/browser-rendering-tests.py --require-$REQUIRED_BACKEND --software-gpu
          fi
      - name: Verify reproducible generated distributions
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-${{ matrix.backend }}-${{ matrix.display }}
          path: reports/rendering
          retention-days: 14
