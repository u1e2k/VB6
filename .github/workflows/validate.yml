name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: npm test
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Resolve browser executable
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Existing IDE and runtime integration regressions
        run: |
          python tools/browser-tests.py
          python tools/browser-parity-tests.py
          python tools/browser-features-04.py
          python tools/recovery-browser-tests.py
          python tools/browser-finalization-05.py
          python tools/browser-boundaries-06.py
      - name: Verify reproducible generated bundles
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
  browser-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Detached browser windows over HTTP and file origins
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:windows
      - name: Optional IDE themes, runtime isolation and appearance persistence
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:themes:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-windows-${{ matrix.browser }}
          path: |
            reports/browser-windows
            reports/ide-themes
          if-no-files-found: ignore
          retention-days: 7
  rendering-qualification:
    # One final pre-merge qualification; the job is retired afterwards to keep
    # main's essential Validate/Pages policy. No additional workflow is created.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
        display: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python -m pip install playwright==1.57.0 Pillow
      - name: Verify exact pixel-comparison statistics and bounds
        run: python tools/test_rendering_pixels.py
      - run: python -m playwright install --with-deps chromium
      - name: Install software Vulkan presentation dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve test browser
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Required GPU execution including all eight optional IDE themes
        env:
          DISPLAY_MODE: ${{ matrix.display }}
          REQUIRED_BACKEND: ${{ matrix.backend }}
          RENDERING_BROWSER_FLAGS: --enable-gpu --enable-features=Vulkan --ignore-gpu-blocklist
        run: |
          # Source: Chris Gervang, https://github.com/visgl/luma.gl/issues/2874
          args=()
          if [ "$DISPLAY_MODE" = headed ]; then
            args+=(--headed)
            # The headed native HTML scrollbar raster alternates one channel
            # level before a GPU layer exists. Fix only its native-tile raster
            # path for this oracle; WebGPU/WebGL2 draws and GPU readback remain
            # mandatory. Headless retains GPU native-tile raster coverage.
            # Chromium flag semantics (not --disable-gpu):
            # https://chromium.googlesource.com/chromium/src/+/3662e2b281fb1aa7997b352651f42e43fef6a6af/gpu/config/gpu_switches.cc
            export RENDERING_BROWSER_FLAGS="$RENDERING_BROWSER_FLAGS --disable-gpu-rasterization"
          fi
          xvfb-run -a python tools/browser-rendering-tests.py --require-$REQUIRED_BACKEND --software-gpu "${args[@]}"
      - name: Require all 39 cases and unchanged generated products
        run: |
          python tools/verify-rendering-report.py reports/rendering/report.json --backend ${{ matrix.backend }}
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-themes-${{ matrix.backend }}-${{ matrix.display }}
          path: reports/rendering
          retention-days: 14
