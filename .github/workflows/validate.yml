name: Validate
on:
  push:
    branches: [main, feat/webgpu-ui-rendering]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.ref != 'refs/heads/feat/webgpu-ui-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source for reproducible validation
        run: git archive --format=zip HEAD -o /tmp/vb6-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: /tmp/vb6-source.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: npm test
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Resolve browser executable
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Existing IDE and runtime integration regressions
        run: |
          python tools/browser-tests.py
          python tools/browser-parity-tests.py
          python tools/browser-features-04.py
          python tools/recovery-browser-tests.py
          python tools/browser-finalization-05.py
          python tools/browser-boundaries-06.py
      - name: Verify reproducible generated bundles
        run: git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
  browser-windows:
    if: github.ref != 'refs/heads/feat/webgpu-ui-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Detached browser windows over HTTP and file origins
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:windows
      - name: Optional IDE themes, runtime isolation and appearance persistence
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:themes:browser
      - name: Download every sample from the IDE and reopen exact HTML bytes
        env:
          VB6_BROWSER: ${{ matrix.browser }}
        run: npm run test:sample-exports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-windows-${{ matrix.browser }}
          path: |
            reports/browser-windows
            reports/ide-themes
            reports/win32-exports
          if-no-files-found: ignore
          retention-days: 7
  win32-system-contracts:
    if: github.ref != 'refs/heads/feat/webgpu-ui-rendering'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record installed Windows calendar and formatting contracts
        shell: pwsh
        run: ./tools/win32-system-oracle.ps1
      - name: Compare every native field to the standalone browser package
        run: node tools/compare-win32-system.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-system-contracts
          path: reports/win32-system
          retention-days: 7
  rendering-qualification:
    if: github.ref != 'refs/heads/feat/webgpu-ui-rendering'
    # Temporary pre-merge check; preserve main's two-workflow policy afterwards.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
        display: [headless, headed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python -m pip install playwright==1.57.0 Pillow
      - run: python tools/test_rendering_pixels.py
      - run: python tools/test_rendering_capture.py
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Resolve browser executable
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print('CHROMIUM_PATH=' + p.chromium.executable_path)
          PY
      - name: Actual GPU API execution and exact theme pixels
        env:
          DISPLAY_MODE: ${{ matrix.display }}
          REQUIRED_BACKEND: ${{ matrix.backend }}
          RENDERING_BROWSER_FLAGS: --enable-gpu --enable-features=Vulkan --ignore-gpu-blocklist
        run: |
          args=()
          if [ "$DISPLAY_MODE" = headed ]; then args+=(--headed); fi
          xvfb-run -a python tools/browser-rendering-tests.py --require-$REQUIRED_BACKEND --software-gpu "${args[@]}"
      - name: Require every case and reproducible outputs
        run: |
          python tools/verify-rendering-report.py reports/rendering/report.json --backend ${{ matrix.backend }}
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-themes-${{ matrix.backend }}-${{ matrix.display }}
          path: reports/rendering
          retention-days: 14
  integrate-rendering:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/webgpu-ui-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish only the pinned and locally verified integration tree
        run: python tools/integrate-rendering-themes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-theme-integrated-source
          path: /tmp/rendering-theme-integration
          retention-days: 7
