name: VB.NET migration
on:
  pull_request:
    paths:
      - 'packages/vbnet-migration/**'
      - 'tests/vbnet-migration*.test.mjs'
      - 'tests/fixtures/vbnet-migration/**'
      - 'tools/*vbnet*'
      - 'src/ide/vbnet-export.js'
      - '.github/workflows/vbnet-migration.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbnet-migration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute generated VB.NET runtime fixtures
        run: node tools/test-vbnet-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vbnet-runtime
          path: artifacts/vbnet-migration/runtime
          retention-days: 7
